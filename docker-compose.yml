services:
  foodbot:
    build: .
    container_name: foodbot
    # اجرای خودکار بعد از ریست سرور یا کرش — کلید ۲۴ ساعته بودن
    restart: unless-stopped
    # اگر healthcheck سه بار پشت سر هم شکست بخورد، یعنی ربات هنگ کرده؛
    # سرویس autoheal پایین، کانتینر را خودکار ری‌استارت می‌کند
    labels:
      - autoheal=true
    env_file: .env
    environment:
      TZ: Asia/Tehran
      # دیتابیس روی سرور PostgreSQL است (نه SQLite)
      DATABASE_URL: postgresql+psycopg2://foodbot:foodbot@db:5432/foodbot
    volumes:
      # لاگ‌ها و بکاپ‌ها باید بیرون از کانتینر ماندگار شوند
      - ./logs:/app/logs
      - ./backups:/app/backups
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      autoheal:
        condition: service_started

  # دیتابیس Production — داده‌ها در volume ماندگار می‌مانند
  db:
    image: postgres:16-alpine
    container_name: foodbot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodbot
      POSTGRES_PASSWORD: foodbot
      POSTGRES_DB: foodbot
      TZ: Asia/Tehran
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbot -d foodbot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # نگهبان: کانتینرهایی که healthcheckشان fail شود را خودکار ری‌استارت می‌کند
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      TZ: Asia/Tehran
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
